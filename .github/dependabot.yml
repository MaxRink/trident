version: 2
updates:
  - package-ecosystem: docker
    directories:
    - /
    - /contrib/docker/plugin
    - /operator
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: helm
    directory: /helm/trident-operator
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: pip
    directory: /contrib/ontap/trident_role/script
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
